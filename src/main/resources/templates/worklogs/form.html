<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title th:text="${editMode} ? '업무일지 수정' : '업무일지 작성'">업무일지 작성</title>
    <style>
        body { font-family: -apple-system, "Malgun Gothic", sans-serif; max-width: 640px; margin: 30px auto; padding: 0 16px; color: #222; }
        h1 { font-size: 20px; }
        label { display: block; margin: 14px 0 4px; font-weight: bold; font-size: 14px; }
        input[type=text], input[type=date], textarea, select {
            width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 14px;
        }
        textarea { min-height: 140px; resize: vertical; }
        .row { margin-bottom: 8px; }
        .range { display: flex; gap: 10px; align-items: center; }
        .range > div { flex: 1; }
        .checkbox-row { margin-top: 10px; display: flex; align-items: center; gap: 6px; }
        .checkbox-row input { width: auto; }
        .checkbox-row label { margin: 0; font-weight: normal; }
        .btns { margin-top: 20px; display: flex; gap: 10px; }
        .btn { display: inline-block; padding: 8px 16px; background: #2b6cb0; color: #fff; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; font-size: 14px; }
        .btn-secondary { background: #718096; }
        .hint { color: #888; font-size: 12px; margin-top: 4px; }
    </style>
</head>
<body>
<h1 th:text="${editMode} ? '업무일지 수정' : '업무일지 작성'">업무일지 작성</h1>

<form th:action="@{/worklogs/save}" method="post" id="worklogForm">
    <!-- 수정/신규 구분 플래그 -->
    <input type="hidden" name="editMode" th:value="${editMode}"/>

    <!-- ── 수정 모드: 단일 날짜(읽기전용) ── -->
    <div class="row" th:if="${editMode}">
        <label for="date">날짜</label>
        <input type="date" id="date" name="date" th:value="${entry.date()}" readonly required/>
        <div class="hint">수정 모드에서는 날짜를 변경할 수 없습니다.</div>
    </div>

    <!-- ── 신규 모드: 날짜 범위 ── -->
    <div class="row" th:unless="${editMode}">
        <label>기간 (시작일 ~ 종료일)</label>
        <div class="range">
            <div>
                <input type="date" id="startDate" name="startDate" th:value="${entry.date()}" required/>
            </div>
            <span>~</span>
            <div>
                <input type="date" id="endDate" name="endDate" th:value="${entry.date()}" required/>
            </div>
        </div>
        <div class="checkbox-row">
            <input type="checkbox" id="skipWeekendHoliday" name="skipWeekendHoliday" value="true" checked/>
            <label for="skipWeekendHoliday">주말·공휴일 제외하고 저장</label>
        </div>
        <div class="hint">기간 내 각 날짜에 아래 내용이 동일하게 저장됩니다. 하루만 등록하려면 시작일과 종료일을 같게 두세요.</div>
    </div>

    <div class="row">
        <label for="type">업무유형</label>
        <select id="type" name="type">
            <option value="프로젝트" th:selected="${entry.type()} == '프로젝트'">프로젝트</option>
            <option value="휴가" th:selected="${entry.type()} == '휴가'">휴가</option>
            <option value="교육" th:selected="${entry.type()} == '교육'">교육</option>
            <option value="기타" th:selected="${entry.type()} == '기타'">기타</option>
        </select>
    </div>

    <div class="row">
        <label for="project">프로젝트</label>
        <input type="text" id="project" name="project" th:value="${entry.project()}"
               placeholder="프로젝트명 (휴가면 비워두세요)"/>
    </div>

    <div class="row">
        <label for="content">업무 내용</label>
        <textarea id="content" name="content" th:text="${entry.content()}"
                  placeholder="오늘 한 업무를 입력하세요"></textarea>
    </div>

    <div class="btns">
        <button type="submit" class="btn">저장</button>
        <a class="btn btn-secondary" th:href="@{/worklogs}">취소</a>
    </div>
</form>

<!-- 신규 모드에서 종료일이 시작일보다 빠르면 제출 막기 -->
<script th:unless="${editMode}">
    document.getElementById('worklogForm').addEventListener('submit', function (e) {
        var s = document.getElementById('startDate').value;
        var en = document.getElementById('endDate').value;
        if (s && en && en < s) {
            e.preventDefault();
            alert('종료일이 시작일보다 빠릅니다. 다시 확인해 주세요.');
        }
    });
</script>
</body>
</html>
