server:
  port: 8080

# 저장 방식 선택: excel(기본) 또는 db
# 이 값에 따라 활성 프로파일이 정해지고, 그에 맞는 설정 파일이 로드된다.
worklog:
  storage: ${WORKLOG_STORAGE:}

spring:
  profiles:
    active: ${worklog.storage}

app:
  worklog:
    # 업무일지 엑셀 파일들이 들어있는 폴더
    directory: ${WORKLOG_DIR:}
    # 파일명 접두사. 실제 파일: MmList_202607.xls / MmList_20260724.xls 등
    # → "MmList_" + yyyyMM 으로 시작하는 파일을 그 달 파일로 인식
    file-prefix: "MmList_"

  # ── 알림 채널 (원하는 것만 채우면 됨. 채운 채널로 동시 전송) ──
  telegram:
    # @BotFather 로 발급받은 봇 토큰
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    # 알림 받을 chat id
    chat-id: ${TELEGRAM_CHAT_ID:}

  slack:
    # Slack Incoming Webhook URL (예: https://hooks.slack.com/services/T00/B00/XXX)
    webhook-url: ${SLACK_WEBHOOK_URL:}

  discord:
    # Discord Webhook URL (예: https://discord.com/api/webhooks/000/XXX)
    webhook-url: ${DISCORD_WEBHOOK_URL:}

  llm:
    # 사용할 제공자 선택: anthropic 또는 openai
    provider: ${LLM_PROVIDER:}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}

  holiday:
    # true 로 하면 공공데이터포털 특일정보 API 사용, 실패 시 하드코딩 폴백
    use-api: true
    # 공공데이터포털에서 발급받은 서비스키 (디코딩된 일반 키 권장)
    service-key: ${HOLIDAY_API_KEY:}

logging:
  level:
    com.example.worklogagent: INFO
