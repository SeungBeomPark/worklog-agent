plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '1.0.0'

java {
    // Java 21 (Spring Boot 3.x 는 17 이상, Spring AI MCP 는 21 권장)
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

ext {
    // Spring AI 버전 (MCP 서버 스타터)
    springAiVersion = '1.0.9'
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {
    // 웹 (RestClient 사용, 테스트용 REST 엔드포인트)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 화면 (Thymeleaf)
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // DB 버전 (worklog.storage=db 일 때 사용)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.mysql:mysql-connector-j'          // MySQL/MariaDB 드라이버
    runtimeOnly 'com.h2database:h2'                     // 로컬 테스트용 (선택)

    // 엑셀 파싱: poi-ooxml 하나면 .xls(HSSF)와 .xlsx(XSSF) 모두 처리
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // MCP 서버 (Claude Desktop 등에 업무일지 도구를 노출)
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server-webmvc'

    // 테스트
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
